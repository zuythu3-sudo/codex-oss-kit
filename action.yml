name: Codex OSS maintainer check
description: Run oss-ready and docs-drift on a checked-out public repository
author: zuythu3-sudo
branding:
  icon: check-square
  color: purple

inputs:
  path:
    description: Repository path to audit
    required: false
    default: "."
  checks:
    description: "Which checks to run: all, oss-ready, or docs-drift"
    required: false
    default: all
  lang:
    description: "Report language: auto, en, or zh"
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Run maintainer checks
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        CHECKS: ${{ inputs.checks }}
        CHECK_LANG: ${{ inputs.lang }}
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "${CHECKS}" in
          all|oss-ready|docs-drift) ;;
          *)
            echo "Unknown checks: ${CHECKS}"
            exit 1
            ;;
        esac

        status=0
        run_check() {
          local title="$1"
          local script="$2"
          local out
          local code
          local lang_args=()
          if [ -n "${CHECK_LANG}" ] && [ "${CHECK_LANG}" != "auto" ]; then
            lang_args=(--lang "${CHECK_LANG}")
          fi
          set +e
          out="$(node "$script" "$CHECK_PATH" "${lang_args[@]}" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## ${title}"
              echo
              if [ "$code" -eq 0 ]; then
                echo "Result: passed"
              else
                echo "Result: failed"
              fi
              echo
              echo '```text'
              printf '%s\n' "$out"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" -ne 0 ]; then
            status=1
          fi
        }

        if [ "${CHECKS}" = "all" ] || [ "${CHECKS}" = "oss-ready" ]; then
          run_check "oss-ready" "${ACTION_ROOT}/.agents/skills/oss-ready/scripts/oss-ready.mjs"
        fi
        if [ "${CHECKS}" = "all" ] || [ "${CHECKS}" = "docs-drift" ]; then
          run_check "docs-drift" "${ACTION_ROOT}/.agents/skills/docs-drift/scripts/docs-drift.mjs"
        fi
        exit "$status"
